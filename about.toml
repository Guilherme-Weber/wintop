# cargo-about: avisos de licença das crates ligadas no wintop.exe (THIRD-PARTY-NOTICES.txt no
# pacote; gerado pelo scripts/package.ps1). Só o que vai no executável: alvo Windows, sem
# dependências de desenvolvimento e de build.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
accepted = [
    "MIT",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "WTFPL",
]
