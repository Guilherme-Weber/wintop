name: release

# Push de uma tag v<versão> (igual à do Cargo.toml): as checagens da CI (ci.yml), o pacote pelo
# scripts/package.ps1, o atestado de procedência do zip e do exe, e a release criada como
# RASCUNHO: nada fica público até a publicação manual na página do GitHub.
# Disparado à mão (workflow_dispatch): ensaio sem tag, sem atestado e sem release; o zip fica
# como artefato da execução.
#
# Privilégio mínimo por job: só o `build` pode atestar e só o `publish` (que não roda código do
# repositório nem compila nada) pode escrever no repositório. Actions fixadas pelo SHA.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: check
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write      # atestado de procedência (só na tag)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag igual à versão do Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, Cargo.toml $v" }
      - name: Toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-about@0.9.3
      # Inno Setup para o instalador (já vem em algumas imagens; senão pelo Chocolatey).
      - name: Inno Setup
        shell: pwsh
        run: ./scripts/ensure-inno.ps1
      # Build limpo (sem cache): o binário publicado não herda nada de execuções anteriores.
      # Na tag, sem a seção da versão no CHANGELOG o pacote falha antes do atestado.
      - name: Pacote
        shell: pwsh
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if ($env:IS_TAG -eq 'true') { ./scripts/package.ps1 -RequireNotes } else { ./scripts/package.ps1 }
      - name: Atestado de procedência
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*-setup.exe
            target/release/wintop.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wintop-dist
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
            dist/notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write      # criar a release (rascunho)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wintop-dist
          path: dist
      # Assinatura ed25519 do zip para a atualização automática (src/update.rs): a chave privada
      # só existe no secret; o `.sig` é conferido com a chave pública embutida no wintop
      # (UPDATE_PUBLIC_KEY, igual a update::PUBLIC_KEY: um teste confere) antes de anexar.
      - name: Assinatura do zip
        env:
          KEY: ${{ secrets.WINTOP_UPDATE_KEY }}
          TAG: ${{ github.ref_name }}
          UPDATE_PUBLIC_KEY: 07525fffb1d1a5b4a8e7904df5c1e8ff8423f9ea5493fce8339b7143ce74c2b6
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "secret WINTOP_UPDATE_KEY ausente"; exit 1; fi
          zip="dist/wintop-${TAG#v}-windows-x64.zip"
          test -f "$zip"
          (cd dist && sha256sum -c "$(basename "$zip").sha256")
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key" pub.der' EXIT
          printf '%s\n' "$KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$zip" -out "$zip.sig"
          # SubjectPublicKeyInfo do Ed25519: prefixo fixo + os 32 bytes da chave.
          echo "302a300506032b6570032100$UPDATE_PUBLIC_KEY" | xxd -r -p > pub.der
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey pub.der -in "$zip" -sigfile "$zip.sig"
          test "$(stat -c %s "$zip.sig")" -eq 64
      - name: Release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="dist/wintop-${TAG#v}-windows-x64.zip"
          test -f "$zip"
          setup="dist/wintop-${TAG#v}-setup.exe"
          test -f "$setup"
          (cd dist && sha256sum -c "$(basename "$setup").sha256")
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "wintop ${TAG#v}" --notes-file dist/notes.md \
            "$setup" "$setup.sha256" "$zip" "$zip.sha256" "$zip.sig"
