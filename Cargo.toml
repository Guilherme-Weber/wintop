[package]
name = "wintop"
version = "1.2.1"
description = "Monitor de sistema em terminal para Windows: CPU, GPU, VRAM, discos, rede e FPS"
license = "MIT"
repository = "https://github.com/Guilherme-Weber/wintop"
edition = "2024"
# A versão com que é compilado e testado (fixada em rust-toolchain.toml).
rust-version = "1.100"

# Binário separado da lib: o manifesto requireAdministrator (build.rs) vai só no wintop.exe,
# e os testes unitários rodam pela lib em qualquer terminal sem elevação.
[[bin]]
name = "wintop"
path = "src/main.rs"
test = false

[dependencies]
windows = { version = "0.62.2", features = [
    "Wdk_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
toml_edit = { version = "0.23", default-features = false, features = ["parse", "display"] }
nvml-wrapper = "0.13"
ratatui = "0.30"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"

# Política de lint (verificada por `cargo clippy --all-targets --locked -- -D warnings`).
# Além do padrão, lints pedantes selecionados.
[lints.clippy]
all = { level = "warn", priority = -1 }
assigning_clones = "warn"
if_not_else = "warn"
ignore_without_reason = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
single_match_else = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind (padrão), não abort: um coletor que entra em pânico é isolado com catch_unwind
# e marcado como falha, sem derrubar a interface.
panic = "unwind"
strip = true
# Arquivo e linha de cada frame no .pdb separado, sem aumentar o executável.
debug = "line-tables-only"

# Fuzz longo dos parsers (`src/fuzz.rs`): otimizado, mas com overflow e debug_assert ligados (o
# release os desliga, e um overflow é justamente o que o fuzz procura).
[profile.fuzz]
inherits = "release"
overflow-checks = true
debug-assertions = true
lto = false
codegen-units = 16

# Spikes da Etapa 0 (examples/): os testes unitários da decodificação rodam com `cargo test`.
[[example]]
name = "spike_pawnio"
test = true

[[example]]
name = "spike_discos"
test = true

[[example]]
name = "spike_rtss"
test = true

[dev-dependencies]
insta = "1.49.0"
tracelogging = "1"
# Só para o `fps_probe` (janela D3D11 que gera FPS conhecido): não entram no binário.
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "fps_probe"
test = true

[[example]]
name = "spike_framegen"
test = true
